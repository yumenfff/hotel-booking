server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/user/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: hotel-booking-secret-key-for-jwt-signing-2026-change-me
